[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=68" ]

[project]
name = "mark2audio"
version = "0.1.0"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [ "fastapi>=0.115", "markdown-it-py>=3", "numpy>=1.26", "python-multipart>=0.0.9", "uvicorn>=0.30" ]
optional-dependencies.tts = [ "kokoro-onnx>=0.4" ]

[dependency-groups]
dev = [ "bandit>=1.7", "httpx2>=2.16", "mypy>=1.11", "pre-commit>=4", "pytest>=8", "pytest-cov>=5", "ruff>=0.6" ]

[tool.setuptools]
packages.find.include = [ "app*" ]
package-data.app = [ "static/*" ]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov=app --cov-fail-under=80"

[tool.coverage]
run.omit = [ "app/tts_kokoro.py" ]

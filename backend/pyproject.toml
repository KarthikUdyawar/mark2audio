[project]
name = "mark2audio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "markdown-it-py>=3.0", "numpy>=1.26"]

[project.optional-dependencies]
tts = ["kokoro-onnx>=0.4"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-fail-under=80"

[tool.coverage.run]
omit = ["app/tts_kokoro.py"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

# api serves REST + the web UI; worker runs conversions. Same image, shared ./data.
x-common: &common
  build: { context: ., dockerfile: backend/Dockerfile }
  image: mark2audio:local # one stable name for both services (Trivy scans it)
  volumes: ["./data:/data", "./models/kokoro:/models:ro"]
  env_file: [{ path: .env, required: false }]
  environment: # container paths; must win over .env (which holds native paths like data/)
    M2A_DATA_DIR: /data
    M2A_MODEL_DIR: /models
  restart: unless-stopped
services:
  api:
    <<: *common
    ports: ["127.0.0.1:8000:8000"] # localhost only; do not expose to LAN unless you mean to
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
  worker:
    <<: *common
    command: ["python", "-m", "app.worker"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: # heartbeat file younger than 300 s (D-020); a long FFmpeg encode may exceed it
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; sys.exit(time.time()-os.stat('/data/worker.heartbeat').st_mtime>=300)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
